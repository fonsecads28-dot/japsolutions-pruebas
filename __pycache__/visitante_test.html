<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Entrada - Smart Doorbell</title>
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-950 text-white font-sans flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-slate-900 rounded-3xl p-6 border border-slate-800 shadow-xl">
        <!-- Nombre del Edificio Dinámico -->
        <h1 id="edf-nombre" class="text-2xl font-bold text-center text-emerald-400 mb-2">Cargando Edificio...</h1>
        <p class="text-xs text-slate-400 text-center mb-6">Código QR Escaneado: <span class="text-slate-300 font-mono">edf-madero-452</span></p>

        <!-- Directorio de Unidades -->
        <label class="block text-sm font-medium text-slate-300 mb-2">Seleccione el Departamento:</label>
        <select id="select-deptos" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 mb-6">
            <!-- Los departamentos del seed.py se inyectarán aquí por JavaScript -->
        </select>

        <!-- Nombre del Visitante -->
        <label class="block text-sm font-medium text-slate-300 mb-2">Su Nombre:</label>
        <input type="text" id="visitante-nombre" value="Visita de Calle" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 mb-6">

        <!-- Botón de Llamada -->
        <button id="btn-llamar" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-98 transition-all text-white font-bold py-4 rounded-xl flex items-center justify-center gap-2">
            🔔 Iniciar Videollamada
        </button>

        <!-- Consola de Estado / Debugger para pruebas -->
        <div id="consola-status" class="mt-6 p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono text-slate-400 hidden">
            <strong>Estado del Servidor:</strong> <span id="status-text">Esperando acción...</span>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000/api/v1";
        const TOKEN_URL_EJEMPLO = "edf-madero-452"; // Token de tu seed.py

        // 1. Al cargar la página, consultamos al Backend de Python los datos del QR
        async function cargarDatosQR() {
            try {
                const response = await fetch(`${API_BASE}/visitante/configurar-qr/${TOKEN_URL_EJEMPLO}`);
                if (!response.ok) throw new Error("QR no registrado en la base de datos");
                
                const data = await response.json();
                
                // Pintamos el nombre del edificio en la interfaz web
                document.getElementById('edf-nombre').innerText = data.edificio_nombre;
                
                // Limpiamos e inyectamos la lista de departamentos reales (1A, 1B, 4B...)
                const select = document.getElementById('select-deptos');
                select.innerHTML = "";
                data.directorios.forEach(depto => {
                    const option = document.createElement('option');
                    option.value = depto.id;
                    option.innerText = `Departamento ${depto.unidad}`;
                    select.appendChild(option);
                });
            } catch (err) {
                document.getElementById('edf-nombre').innerText = "❌ Error de Conexión";
                document.getElementById('edf-nombre').classList.replace("text-emerald-400", "text-red-400");
                console.error(err);
            }
        }

        // 2. Evento al hacer clic en "Iniciar Videollamada"
        document.getElementById('btn-llamar').addEventListener('click', async () => {
            const deptoId = document.getElementById('select-deptos').value;
            const nombre = document.getElementById('visitante-nombre').value;
            const consola = document.getElementById('consola-status');
            const statusText = document.getElementById('status-text');

            consola.classList.remove('hidden');
            statusText.innerText = "Enviando señal a FastAPI...";

            try {
                const response = await fetch(`${API_BASE}/visitante/llamar`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        departamento_id: parseInt(deptoId),
                        nombre_visitante: nombre
                    })
                });

                const resultado = await response.json();
                
                // Mostramos en pantalla lo que respondió tu código de Python
                statusText.innerHTML = `
                    <br>✅ Sala Creada: <span class="text-blue-400">${resultado.room_name}</span>
                    <br>📬 ¿Residente Notificado por Firebase?: <span class="${resultado.residente_notificado ? 'text-emerald-400' : 'text-amber-400'}">${resultado.residente_notificado}</span>
                    <br>🔑 Token WebRTC generado.
                `;
            } catch (err) {
                statusText.innerText = "❌ Error al conectar con la API.";
                console.error(err);
            }
        });

        // Inicializar el flujo al cargar la pantalla
        window.addEventListener('DOMContentLoaded', cargarDatosQR);
    </script>
</body>
</html>
